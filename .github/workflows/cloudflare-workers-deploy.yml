on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: Deploy to Cloudflare Workers & Migrate DB
jobs:
  deploy:
    defaults:
      run:
        working-directory: ./website
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
      - run: npm install
        working-directory: ./website
      - name: Build
        run: npm run build
        working-directory: ./website
        env:
          # Source maps are built and uploaded to Sentry only when these are present, so
          # the build still works for anyone running it without them. `SENTRY_RELEASE` is
          # the string the running worker reports as its release too (baked in by
          # `vite.config.ts`), which is what lets Sentry line the two up.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ github.sha }}
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "website"
          packageManager: npm
          command: deploy --keep-vars
          postCommands: |
            echo "*** Running D1 Migrations ***"
            wrangler d1 migrations apply DB --remote
            echo "******"
